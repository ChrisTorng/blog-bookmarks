name: Build Bookmarks API Worker bundle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.jsonc'
      - '.github/workflows/build-api-bundle.yml'
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Compile dependency-bundled API Worker without deploying
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Commit reproducible Worker bundle
        run: |
          test -s dist/index.js
          cp dist/index.js dist/worker.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/worker.js
          if ! git diff --cached --quiet; then
            git commit -m "build: refresh Bookmarks Worker bundle [skip ci]"
            git push
          fi
