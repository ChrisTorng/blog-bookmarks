name: Verify Bookmarks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir .wrangler-verify
      - name: Validate local schema
        run: npx wrangler d1 migrations apply DB --local
